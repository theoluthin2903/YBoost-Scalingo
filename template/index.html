<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Todo List</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <button id="theme-toggle">🌙</button>
    <main>
    <header>
        <h1>Ma Todo List</h1>
    </header>

        <form action="/add" method="POST">
            <input type="text" name="title" placeholder="Qu'avez-vous à faire ?" required>
            <button type="submit">Ajouter</button>
        </form>

        <ul>
            {{range .}}
            <li class="todo-item {{if .Done}}completed{{end}}">
                <span>{{.Title}}</span>
                <div class="actions">
                    <a href="/update?id={{.ID}}" class="btn-check">{{if .Done}}↩️{{else}}✅{{end}}</a>
                    <a href="/delete?id={{.ID}}" class="btn-delete">❌</a>
                </div>
            </li>
            {{else}}
            <p>Aucune tâche pour le moment. Planifiez votre journée !</p>
            {{end}}
        </ul>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
